# LibreLane hardening configuration for the SRAM macro wrapper.
#
# Flow:
#   1. Synthesis   - synthesises sram_1rw_32_1024_wrapper (thin glue RTL)
#   2. Floorplan   - places the IHP SRAM hard macro; stdcells fill the margins
#   3. Placement   - places remaining glue stdcells around the macro
#   4. CTS / Route - clock tree + global/detailed routing
#   5. Signoff     - DRC, LVS, STA
#
# Pre-compiled IHP SRAM macro (from installed PDK):
#   /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/
#   Macro: RM_IHPSG13_1P_1024x32_c2_bm_bist (1024 x 32-bit, single-port)
#   Size:  416.64 x 336.46 um

meta:
  version: 2
  substituting_steps:
    KLayout.DRC: null
    Magic.DRC: null

# -- Design ------------------------------------------------------------------
DESIGN_NAME: sram_1rw_32_1024_wrapper

VERILOG_FILES:
  - dir::src/sram_wrapper.sv

EXTRA_VERILOG_MODELS:
  - dir::src/RM_IHPSG13_1P_1024x32_c2_bm_bist_bb.v

# -- PDK ---------------------------------------------------------------------
PDK: ihp-sg13g2
STD_CELL_LIBRARY: sg13g2_stdcell

# -- Timing ------------------------------------------------------------------
CLOCK_PORT: clk
CLOCK_PERIOD: 10.0   # 100 MHz

# -- Floorplan ---------------------------------------------------------------
# Die area: SRAM footprint (416.64 x 336.46 um) + 50 um side margins.
# Bottom margin is 52 um (2 um extra) to give M2.f/M3.f wide-metal 600 nm
# clearance between routed signal jogs and the SRAM's full-coverage M2/M3 OBS.
FP_SIZING: absolute
DIE_AREA: [0, 0, 516.64, 438.46]

# Low utilisation: the macro dominates the die; stdcells live in the margins.
FP_CORE_UTIL: 10

# Keep std-cell rows away from the macro to provide a clean routing channel
# and prevent wide-metal DRC violations near the macro boundary.
FP_MACRO_VERTICAL_HALO: 2
FP_MACRO_HORIZONTAL_HALO: 2

# Force M3 jogs on Metal2 routes in the 1 µm band just below the M2.f
# wide-metal danger zone (10 µm below the SRAM bottom edge at y=52).
# Without this, signal wires running up to SRAM pins on M2 can exceed the
# 10 µm length threshold and violate M2.f spacing to adjacent M2 segments.
ROUTING_OBSTRUCTIONS:
  - [Metal2, 50, 41.5, 466.64, 42.5]

# -- Hard macro definition ---------------------------------------------------
# instances: keyed by Verilog instance name (u_sram), not cell type.
# Location is the macro origin with 50 µm margin; orientation N = R0.
MACROS:
  RM_IHPSG13_1P_1024x32_c2_bm_bist:
    gds:
      - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/gds/RM_IHPSG13_1P_1024x32_c2_bm_bist.gds
    lef:
      - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lef/RM_IHPSG13_1P_1024x32_c2_bm_bist.lef
    instances:
      u_sram:
        location: [50, 52]
        orientation: N
    spice:
      - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/cdl/RM_IHPSG13_1P_1024x32_c2_bm_bist.cdl
    lib:
      "*typ*":
        - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lib/RM_IHPSG13_1P_1024x32_c2_bm_bist_typ_1p20V_25C.lib
      "*fast*":
        - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lib/RM_IHPSG13_1P_1024x32_c2_bm_bist_fast_1p32V_m55C.lib
      "*slow*":
        - /foss/pdks/ihp-sg13g2/libs.ref/sg13g2_sram/lib/RM_IHPSG13_1P_1024x32_c2_bm_bist_slow_1p08V_125C.lib

# -- Power distribution network ----------------------------------------------
# Values match IHP SG13G2 PDK defaults (TopMetal1 vertical, TopMetal2 horizontal).
PDN_VOFFSET: 13.6
PDN_HOFFSET: 13.6
PDN_VWIDTH: 2.2
PDN_HWIDTH: 2.2
PDN_VPITCH: 75.6
PDN_HPITCH: 75.6
# Map SRAM macro power pins (VDD!, VDDARRAY!, VSS!) to global VPWR/VGND nets.
# Pattern VDD.* matches both VDD! and VDDARRAY! (IHP SRAM uses split array supply).
PDN_MACRO_CONNECTIONS:
  - "u_sram VPWR VGND VDD.* VSS.*"

PDN_CFG: dir::pdn_cfg.tcl

PDN_SKIPTRIM: true

# The IHP SRAM GDS has no prBoundary layer; use PDK mode so Magic reads the
# GDS directly rather than requiring an extracted FIXED_BBOX.
MAGIC_MACRO_STD_CELL_SOURCE: "PDK"

# Run Magic DRC on DEF+LEF abstracts (not the merged GDS) so that the
# pre-verified SRAM macro's internal layout is treated as a blackbox.
MAGIC_DRC_USE_GDS: false

# Disable FEOL (transistor-level) checks in KLayout DRC.
# Our wrapper has no transistors and the SRAM internals are IHP-verified.
KLAYOUT_DRC_OPTIONS:
  no_feol: true
  run_mode: deep
  no_recommended: true

# -- IHP SG13G2 overrides ----------------------------------------------------
pdk::ihp-sg13g2:
  CLOCK_PERIOD: 10.0
  FP_CORE_UTIL: 10
  PL_TARGET_DENSITY_PCT: 15
