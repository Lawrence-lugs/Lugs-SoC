name: CI

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday 03:00 UTC — re-pull base image
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools

jobs:

  # ── 0. Detect which paths changed ────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
      sram: ${{ steps.filter.outputs.sram }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'
            sram:
              - 'sram/**'

  # ── 1. Build container image (only when .devcontainer changes) ───────────────
  docker:
    name: Build container
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (GH)
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          pull: true
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # ── 2–6. Full CI pipeline (single container pull) ────────────────────────────
  # All test, harden, and DRC stages run as sequential steps in one job so the
  # container image is pulled exactly once.
  ci:
    name: CI pipeline
    needs: [changes, docker]
    if: always() && needs.changes.result == 'success' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # tpu submodule uses SSH; rewrite to HTTPS so CI can clone it without a key.
      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      # ── Base tests ────────────────────────────────────────────────────────────
      - name: test-base / ibex-build
        id: test-ibex
        run: make -C ibex-build test-base

      - name: test-base / tpu-build
        id: test-tpu
        run: make -C tpu-build test-base

      - name: test-base / sram
        id: test-sram
        run: make -C sram test-base

      # ── Top-level RTL tests ───────────────────────────────────────────────────
      - name: test-rtl
        id: test-rtl
        run: make test-rtl

      # ── Macro hardening ───────────────────────────────────────────────────────
      - name: harden / ibex-build
        id: harden-ibex
        run: make -C ibex-build harden

      - name: harden / tpu-build
        id: harden-tpu
        run: make -C tpu-build harden

      # Restore sram/outputs/ from gh-pages so harden can be skipped when sram
      # sources are unchanged. Sets restored=false on cold start (path absent).
      - name: Restore SRAM outputs from gh-pages
        id: restore-sram
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git checkout FETCH_HEAD -- sram/outputs/ 2>/dev/null \
              && [ -d sram/outputs ] && [ -n "$(ls -A sram/outputs)" ]; then
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: harden / sram
        id: harden-sram
        if: needs.changes.outputs.sram == 'true' || steps.restore-sram.outputs.restored == 'false'
        run: make -C sram harden

      # Upload sram/outputs/ regardless of whether we freshly hardened or restored
      # from gh-pages — the pages job always needs this artifact to persist the
      # collateral back into the gh-pages branch for future restore-sram steps.
      - name: Upload SRAM outputs
        if: steps.restore-sram.outputs.restored == 'true' || steps.harden-sram.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: outputs-sram
          path: sram/outputs/
          if-no-files-found: error

      # ── SRAM DRC (non-blocking) ───────────────────────────────────────────────
      - name: drc / sram
        id: drc-sram
        continue-on-error: true
        run: make -C sram drc

      - name: Upload SRAM DRC reports
        if: always() && steps.drc-sram.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: drc-reports-sram
          path: sram/outputs/drc_reports/
          if-no-files-found: warn

      # ── Top-level SoC hardening ───────────────────────────────────────────────
      - name: harden / top-level SoC
        id: harden-top
        run: make harden

      # ── Upload top-level outputs ──────────────────────────────────────────────
      - name: Upload top-level outputs
        if: steps.harden-top.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: outputs-top
          path: outputs/
          if-no-files-found: error

      # ── Top-level DRC (non-blocking) ──────────────────────────────────────────
      - name: drc / top-level
        id: drc-top
        continue-on-error: true
        run: make drc

      - name: Upload top-level DRC reports
        if: always() && steps.drc-top.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: drc-reports-top
          path: outputs/drc_reports/
          if-no-files-found: warn

      # ── Write ci_results.json (always, so pages job can consume it) ───────────
      - name: Write ci_results.json
        if: always()
        env:
          R_TEST_IBEX:   ${{ steps.test-ibex.outcome }}
          R_TEST_TPU:    ${{ steps.test-tpu.outcome }}
          R_TEST_SRAM:   ${{ steps.test-sram.outcome }}
          R_TEST_RTL:    ${{ steps.test-rtl.outcome }}
          R_HARDEN_IBEX: ${{ steps.harden-ibex.outcome }}
          R_HARDEN_TPU:  ${{ steps.harden-tpu.outcome }}
          R_HARDEN_SRAM: ${{ steps.harden-sram.outcome }}
          R_DRC_SRAM:    ${{ steps.drc-sram.outcome }}
          R_HARDEN_TOP:  ${{ steps.harden-top.outcome }}
          R_DRC_TOP:     ${{ steps.drc-top.outcome }}
          COMMIT_SHA:    ${{ github.sha }}
          RUN_ID:        ${{ github.run_id }}
          REPO:          ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          data = {
              "timestamp": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "commit_sha": os.environ["COMMIT_SHA"],
              "run_id":     os.environ["RUN_ID"],
              "run_url":    f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['RUN_ID']}",
              "stages": {
                  "test_ibex":   os.environ["R_TEST_IBEX"],
                  "test_tpu":    os.environ["R_TEST_TPU"],
                  "test_sram":   os.environ["R_TEST_SRAM"],
                  "test_rtl":    os.environ["R_TEST_RTL"],
                  "harden_ibex": os.environ["R_HARDEN_IBEX"],
                  "harden_tpu":  os.environ["R_HARDEN_TPU"],
                  "harden_sram": os.environ["R_HARDEN_SRAM"],
                  "drc_sram":    os.environ["R_DRC_SRAM"],
                  "harden_top":  os.environ["R_HARDEN_TOP"],
                  "drc_top":     os.environ["R_DRC_TOP"],
              },
          }
          with open("ci_results.json", "w") as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Upload CI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          path: ci_results.json
          if-no-files-found: warn

      # ── Pipeline summary (always runs, shows pass/fail table) ─────────────────
      - name: Write pipeline summary
        if: always()
        env:
          R_TEST_IBEX:  ${{ steps.test-ibex.outcome }}
          R_TEST_TPU:   ${{ steps.test-tpu.outcome }}
          R_TEST_SRAM:  ${{ steps.test-sram.outcome }}
          R_TEST_RTL:   ${{ steps.test-rtl.outcome }}
          R_HARDEN_IBEX: ${{ steps.harden-ibex.outcome }}
          R_HARDEN_TPU:  ${{ steps.harden-tpu.outcome }}
          R_HARDEN_SRAM: ${{ steps.harden-sram.outcome }}
          R_DRC_SRAM:    ${{ steps.drc-sram.outcome }}
          R_HARDEN_TOP:  ${{ steps.harden-top.outcome }}
          R_DRC_TOP:     ${{ steps.drc-top.outcome }}
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚠️" ;;
              *)         echo "⏭️" ;;
            esac
          }
          {
            echo "## Pipeline Results"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| test-base / ibex-build      | $(icon "$R_TEST_IBEX")  \`$R_TEST_IBEX\`  |"
            echo "| test-base / tpu-build       | $(icon "$R_TEST_TPU")   \`$R_TEST_TPU\`   |"
            echo "| test-base / sram            | $(icon "$R_TEST_SRAM")  \`$R_TEST_SRAM\`  |"
            echo "| test-rtl                    | $(icon "$R_TEST_RTL")   \`$R_TEST_RTL\`   |"
            echo "| harden / ibex-build         | $(icon "$R_HARDEN_IBEX") \`$R_HARDEN_IBEX\` |"
            echo "| harden / tpu-build          | $(icon "$R_HARDEN_TPU")  \`$R_HARDEN_TPU\`  |"
            echo "| harden / sram               | $(icon "$R_HARDEN_SRAM") \`$R_HARDEN_SRAM\` |"
            echo "| drc / sram *(non-blocking)* | $(icon "$R_DRC_SRAM")    \`$R_DRC_SRAM\`    |"
            echo "| harden / top-level SoC      | $(icon "$R_HARDEN_TOP")  \`$R_HARDEN_TOP\`  |"
            echo "| drc / top-level *(non-blocking)* | $(icon "$R_DRC_TOP") \`$R_DRC_TOP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 7. Publish dashboard + outputs to GitHub Pages ─────────────────────────
  pages:
    name: Publish to GitHub Pages
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo (for docs/)
        uses: actions/checkout@v4

      - name: Download top-level outputs
        uses: actions/download-artifact@v4
        with:
          name: outputs-top
          path: _deploy/

      # Persist sram/outputs/ into gh-pages so restore-sram can fetch it on
      # future runs where sram sources have not changed.
      - name: Download SRAM outputs
        uses: actions/download-artifact@v4
        with:
          name: outputs-sram
          path: _deploy/sram/outputs/
          if-no-files-found: warn

      - name: Download CI results
        uses: actions/download-artifact@v4
        with:
          name: ci-results
          path: _deploy/

      - name: Merge docs/ into deploy root
        run: cp -r docs/. _deploy/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy/
          keep_files: false
