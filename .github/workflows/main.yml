name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/lawrence-lugs/regfile_minmax/regfile-study

jobs:

  # ── 1. Build container image (docker-compose → buildx bake, cache via GHCR) ──
  docker:
    name: Build container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Use docker-compose.yml as the bake source so all build config (context,
      # dockerfile, cache_from) is kept in one place.  We only add cache-to here
      # because the compose file already declares cache_from.
      - name: Build and push (bake from docker-compose.yml)
        run: |
          docker buildx bake \
            -f .devcontainer/docker-compose.yml \
            --push \
            --set "regfile_minmax.cache-to=type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max"

  # ── 2. Per-subfolder base tests (parallel matrix) ────────────────────────────
  test-base:
    name: test-base / ${{ matrix.subfolder }}
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        subfolder: [ibex-build, tpu-build, sram]
    container:
      image: ghcr.io/lawrence-lugs/regfile_minmax/regfile-study:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # tpu submodule uses SSH; rewrite to HTTPS so CI can clone it without a key.
      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Run test-base in ${{ matrix.subfolder }}
        run: make -C ${{ matrix.subfolder }} test-base

  # ── 3. Top-level RTL test (runs only after all subfolder tests pass) ─────────
  test-rtl:
    name: test-rtl
    needs: test-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lawrence-lugs/regfile_minmax/regfile-study:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run top-level RTL tests
        run: make test-rtl

  # ── 4. Macro hardening — each subfolder in parallel ───────────────────────────
  harden-macros:
    name: harden / ${{ matrix.subfolder }}
    needs: test-rtl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        subfolder: [ibex-build, tpu-build, sram]
    container:
      image: ghcr.io/lawrence-lugs/regfile_minmax/regfile-study:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Harden ${{ matrix.subfolder }} macro
        run: make -C ${{ matrix.subfolder }} harden

  # ── 5. Top-level SoC hardening (padring + full LibreLane flow) ───────────────
  harden-top:
    name: harden / top-level SoC
    needs: harden-macros
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lawrence-lugs/regfile_minmax/regfile-study:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Harden top-level SoC (padring + full LibreLane flow)
        run: make harden