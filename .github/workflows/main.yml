name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools

jobs:

  # ── 0. Detect which paths changed ────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            devcontainer:
              - '.devcontainer/**'

  # ── 1. Build container image (only when .devcontainer changes) ───────────────
  docker:
    name: Build container
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout (GH)
        uses: actions/checkout@v4


      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
  
  # ── 2. Per-subfolder base tests (parallel matrix) ────────────────────────────
  test-base:
    name: test-base / ${{ matrix.subfolder }}
    needs: [changes, docker]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        subfolder: [ibex-build, tpu-build, sram]
    container:
      image: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # tpu submodule uses SSH; rewrite to HTTPS so CI can clone it without a key.
      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Run test-base in ${{ matrix.subfolder }}
        run: make -C ${{ matrix.subfolder }} test-base

  # ── 3. Top-level RTL test (runs only after all subfolder tests pass) ─────────
  test-rtl:
    name: test-rtl
    needs: test-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Run top-level RTL tests
        run: make test-rtl

  # ── 4. Macro hardening — each subfolder in parallel ───────────────────────────
  harden-macros:
    name: harden / ${{ matrix.subfolder }}
    needs: test-rtl
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        subfolder: [ibex-build, tpu-build, sram]
    container:
      image: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Harden ${{ matrix.subfolder }} macro
        run: make -C ${{ matrix.subfolder }} harden

  # ── 5. Top-level SoC hardening (padring + full LibreLane flow) ───────────────
  harden-top:
    name: harden / top-level SoC
    needs: harden-macros
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/lawrence-lugs/lugs-soc/lugs-soc-tools:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Rewrite SSH submodule URLs to HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Configure git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Harden top-level SoC (padring + full LibreLane flow)
        # make checks for outputs/.harden_done; if it exists the flow is
        # already committed and this step becomes a fast no-op.
        run: make harden